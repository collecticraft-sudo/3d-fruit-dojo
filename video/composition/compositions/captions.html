<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #captions { position: absolute; inset: 0; pointer-events: none; font-family: Montserrat, Inter, sans-serif; }
        #captions .cap { position: absolute; left: 0; right: 0; bottom: 104px; display: flex; justify-content: center; opacity: 0; }
        #captions .pill { max-width: 1560px; padding: 12px 36px 13px; background: rgba(24, 22, 28, 0.88); color: #fbf1d6; border-radius: 20px;
          font-weight: 700; font-size: 46px; line-height: 1.22; letter-spacing: -0.005em; text-align: center; text-wrap: balance; box-shadow: 0 6px 0 rgba(0,0,0,0.25); }
        #captions .pill b { color: #f1b02f; font-weight: 800; }
      </style>
      <div id="captions" data-composition-id="captions" data-width="1920" data-height="1080">
        <div class="cap" id="cap-n00"><div class="pill">This is 3D Fruit Dojo, a fruit slicing game.</div></div>
        <div class="cap" id="cap-n01"><div class="pill">Strap a <b>Joy-Con 2</b> to a 3D-printed sword.</div></div>
        <div class="cap" id="cap-n02"><div class="pill">Its motion sensor streams to your Mac about <b>33 times a second</b>, and drives the blade.</div></div>
        <div class="cap" id="cap-n03"><div class="pill"><b>Three modes.</b> Classic gives you three lives.</div></div>
        <div class="cap" id="cap-n04"><div class="pill">Arcade is a sixty second sprint.</div></div>
        <div class="cap" id="cap-n05"><div class="pill">Zen is calm, with no bombs.</div></div>
        <div class="cap" id="cap-n06"><div class="pill">Chain a combo.</div></div>
        <div class="cap" id="cap-n07"><div class="pill">Dodge a bomb.</div></div>
        <div class="cap" id="cap-n08"><div class="pill">Or <b>freeze</b> time.</div></div>
        <div class="cap" id="cap-n09"><div class="pill">The art began as prompts to <b>Higgsfield</b>.</div></div>
        <div class="cap" id="cap-n10"><div class="pill">The code was built, tested and reviewed by a team of <b>AI agents</b>.</div></div>
        <div class="cap" id="cap-n11"><div class="pill">Tested with a <b>real Joy-Con 2</b>. Swing to slice.</div></div>
      </div>
      <script>
        (function () {
          var K = KF.scene(0, document.getElementById("captions"));
          var E = KF.E;
          var lines = [["n00",0.6,4.2],["n01",5.3,8.66],["n02",8.9,14.58],["n03",14.8,18],["n04",19.2,21.52],["n05",23.6,26.48],["n06",27.7,28.82],["n07",29.4,31],["n08",31.2,32.8],["n09",33,35.8],["n10",36,41.12],["n11",41.4,45.3]];
          lines.forEach(function (l, i) {
            var a = Math.max(0, l[1] - 0.06), b = l[2] + 0.18;
            if (lines[i + 1]) b = Math.min(b, lines[i + 1][1] - 0.2);
            K.track("#cap-" + l[0], [{ t: 0, y: 16, o: 0 }, { t: a, y: 16, o: 0, ease: E.out }, { t: a + 0.2, y: 0, o: 1 }, { t: b - 0.01, y: 0, o: 1, ease: E.soft }, { t: b + 0.1, y: -6, o: 0 }]);
          });
        })();
      </script>
    </template>
  </body>
</html>
