          K.track("#s2-ld3c", [{ t: 0, s: 0, o: 0 }, { t: 2.75, s: 0, o: 0, ease: E.back }, { t: 3.0, s: 1, o: 1, ease: E.lin }, { t: 3.35, s: 1, o: 1, ease: E.lin }, { t: 3.6, s: 1, o: 0 }]);

          // laptop + link
          K.track("#s2-mac", [{ t: 0, x: 90, o: 0 }, { t: 2.45, x: 90, o: 0, ease: E.out }, { t: 3.1, x: 0, o: 1 }]);
          K.track("#s2-bt", [{ t: 0, s: 0, o: 0 }, { t: 2.6, s: 0, o: 0, ease: E.back }, { t: 2.95, s: 1, o: 1 }]);
          [1, 2, 3].forEach(function (n) {
            var b = 2.7 + (n - 1) * 0.18, keys = [{ t: 0, o: 0 }];
            for (var c = 0; c < 5; c++) {
              var s = b + c * 0.9;
              keys.push({ t: s, o: 0, ease: E.out }); keys.push({ t: s + 0.25, o: 1, ease: E.soft }); keys.push({ t: s + 0.75, o: 0 });
            }
            K.track("#s2-arc" + n, keys, { ease: E.lin });
          });
          K.track("#s2-link", [{ t: 0, css: { clipPath: "inset(0 100% 0 0)" } }, { t: 3.0, css: { clipPath: "inset(0 100% 0 0)" }, ease: E.out }, { t: 3.7, css: { clipPath: "inset(0 0% 0 0)" } }]);
          K.track("#s2-l-hz", [{ t: 0, s: 0.6, o: 0, y: 14 }, { t: 3.55, s: 0.6, o: 0, y: 14, ease: E.back }, { t: 3.9, s: 1, o: 1, y: 0 }]);
          // packets travelling along the link (approximate bezier by 3 keyframes)
          K.$$("#s2-dots .dot").forEach(function (d, i) {
            var keys = [{ t: 0, x: 720, y: 430, o: 0 }];
            for (var c = 0; c < 6; c++) {
              var s = 3.7 + c * 0.75 + i * 0.19;
              keys.push({ t: s, x: 720, y: 430, o: 0, ease: E.lin });
              keys.push({ t: s + 0.08, x: 745, y: 428, o: 1, ease: E.lin });
              keys.push({ t: s + 0.32, x: 835, y: 436, o: 1, ease: E.lin });
              keys.push({ t: s + 0.6, x: 940, y: 440, o: 1, ease: E.lin });
              keys.push({ t: s + 0.72, x: 1005, y: 430, o: 0 });
            }
            K.track(d, keys, { ease: E.lin });
          });

          // three swings (sword group) and three cuts on the laptop screen
          var cuts = [
            { i: 1, tc: 4.2, fx: 300, fy: 210, trail: "t1" },
            { i: 2, tc: 5.1, fx: 330, fy: 190, trail: "t2" },
            { i: 3, tc: 5.95, fx: 320, fy: 200, trail: "t3" }
          ];
          var swing = [{ t: 0, r: -34, s: 1.12 }];
          cuts.forEach(function (c) {
            var s = c.tc - 0.25;
            swing.push({ t: s - 0.25, r: -34, s: 1.12, ease: E.inout });
            swing.push({ t: s, r: 6, s: 1.12, ease: E.soft });
            swing.push({ t: s + 0.1, r: 6, s: 1.12, ease: E.inout });
            swing.push({ t: s + 0.55, r: -34, s: 1.12 });
          });
          K.track("#s2-sword", swing, { ease: E.inout });

          cuts.forEach(function (c) {
            var p = "#s2-f" + c.i;
            // rise
            K.track(p + "x", [{ t: 0, x: c.fx - 40 }, { t: c.tc - 1.0, x: c.fx - 40, ease: E.lin }, { t: c.tc + 0.05, x: c.fx }], { ease: E.lin });
            K.track(p + "y", [{ t: 0, y: 460 }, { t: c.tc - 1.0, y: 460, ease: E.out }, { t: c.tc + 0.05, y: c.fy }]);
            K.track(p + "w", [{ t: 0, o: 0, r: -30 }, { t: c.tc - 1.0, o: 0, r: -30, ease: E.lin }, { t: c.tc - 0.95, o: 1, ease: E.out }, { t: c.tc + 0.05, r: 20, o: 1 }, { t: c.tc + 0.06, o: 0 }], { ease: E.lin });
            // halves
            K.track(p + "ax", [{ t: 0, x: 0 }, { t: c.tc + 0.05, x: 0, ease: E.lin }, { t: c.tc + 0.9, x: -80 }], { ease: E.out });
            K.track(p + "ay", [{ t: 0, y: 0 }, { t: c.tc + 0.05, y: 0, ease: E.out }, { t: c.tc + 0.25, y: -22, ease: E.in }, { t: c.tc + 0.9, y: 240 }]);
            K.track(p + "a", [{ t: 0, o: 0, r: 20 }, { t: c.tc + 0.05, o: 0, r: 20 }, { t: c.tc + 0.06, o: 1, r: 20, ease: E.out }, { t: c.tc + 0.9, r: -40, o: 1 }, { t: c.tc + 1.0, o: 0 }], { ease: E.lin });
            K.track(p + "bx", [{ t: 0, x: 0 }, { t: c.tc + 0.05, x: 0, ease: E.lin }, { t: c.tc + 0.9, x: 80 }], { ease: E.out });
            K.track(p + "by", [{ t: 0, y: 0 }, { t: c.tc + 0.05, y: 0, ease: E.out }, { t: c.tc + 0.25, y: -22, ease: E.in }, { t: c.tc + 0.9, y: 240 }]);
            K.track(p + "b", [{ t: 0, o: 0, r: 20 }, { t: c.tc + 0.05, o: 0, r: 20 }, { t: c.tc + 0.06, o: 1, r: 20, ease: E.out }, { t: c.tc + 0.9, r: 80, o: 1 }, { t: c.tc + 1.0, o: 0 }], { ease: E.lin });
            K.track(p + "s", [{ t: 0, s: 0.3, o: 0 }, { t: c.tc + 0.05, s: 0.3, o: 0, ease: E.out }, { t: c.tc + 0.12, s: 0.8, o: 0.95, ease: E.out }, { t: c.tc + 0.7, s: 1.15, o: 0 }]);
            // trail draws just before the cut and fades after
            ["#s2-" + c.trail + "o", "#s2-" + c.trail].forEach(function (q) {
              K.track(q, [{ t: 0, css: { strokeDashoffset: 1 }, o: 0 }, { t: c.tc - 0.3, css: { strokeDashoffset: 1 }, o: 1, ease: E.inout }, { t: c.tc + 0.12, css: { strokeDashoffset: 0 }, o: 1, ease: E.soft }, { t: c.tc + 0.5, o: 0 }], { ease: E.lin });
            });
          });
          // cursor follows the trails (blade cursor)
          var cur = [{ t: 0, x: 0, y: 0, o: 0 }];
          var paths = [[170, 90, 470, 270], [200, 280, 440, 90], [190, 80, 470, 285]];
          cuts.forEach(function (c, i) {
            var p = paths[i];
            cur.push({ t: c.tc - 0.4, x: p[0], y: p[1], o: 0, ease: E.out });
            cur.push({ t: c.tc - 0.3, x: p[0], y: p[1], o: 1, ease: E.inout });
            cur.push({ t: c.tc + 0.12, x: p[2], y: p[3], o: 1, ease: E.soft });
            cur.push({ t: c.tc + 0.45, x: p[2], y: p[3], o: 0 });
          });
          K.track("#s2-cur", cur, { ease: E.lin });

          // bottom line: words in
          var line = K.$("#s2-line");
          var ws = KF.words(line, false);
          ws.forEach(function (w, i) {
            var o = 5.0 + i * 0.16;
            K.track(w, [{ t: 0, y: 40, o: 0 }, { t: o, y: 40, o: 0, ease: E.out }, { t: o + 0.45, y: 0, o: 1 }]);
          });
          ws[2].classList.add("hot");
          K.track("#s2-l-mac", [{ t: 0, s: 0.6, o: 0, y: 14 }, { t: 3.0, s: 0.6, o: 0, y: 14, ease: E.back }, { t: 3.4, s: 1, o: 1, y: 0 }]);
        })();
      </script>
    </template>
  </body>
</html>
