<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s4-made { position: absolute; inset: 0; overflow: hidden; background: #0b0c10; font-family: Montserrat, Inter, sans-serif; color: #1d1a1c; }
        #s4-made .abs { position: absolute; left: 0; top: 0; }
        #s4-made img { display: block; }
        #s4-made .steps { position: absolute; left: 0; right: 0; top: 52px; display: flex; justify-content: center; align-items: center; gap: 18px; }
        #s4-made .step { padding: 8px 24px 8px; border-radius: 14px; border: 4px solid #5a5560; background: #1a1a22; color: #8d8793; font-weight: 800; font-size: 30px; letter-spacing: 0.04em; }
        #s4-made .step.on { border-color: #f1b02f; color: #fbf1d6; background: #24304f; }
        #s4-made .arrow { color: #f1b02f; font-weight: 900; font-size: 34px; }
        #s4-made .tag { position: absolute; left: 80px; top: 800px; padding: 8px 20px 7px; background: #f1b02f; color: #1d1a1c; border: 4px solid #1d1a1c; border-radius: 12px; font-weight: 800; font-size: 30px; box-shadow: 6px 6px 0 rgba(0,0,0,0.5); }
        #s4-made .crop { fill: none; stroke: #f1b02f; stroke-width: 7; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
        #s4-made .sheet { position: absolute; left: 0; top: -3px; width: 1920px; height: 1086px; }
        #s4-made .par { position: absolute; left: 0; top: 0; width: 190px; height: 190px; }
        #s4-made .flash { position: absolute; inset: 0; background: #fff6df; opacity: 0; }
        /* part B */
        #s4-made #s4-b { position: absolute; inset: 0; background: #efe3c4; opacity: 0; }
        #s4-made #s4-b .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(29,26,28,0.07) 2px, transparent 2px), linear-gradient(90deg, rgba(29,26,28,0.07) 2px, transparent 2px); background-size: 60px 60px; }
        #s4-made #s4-b .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(239,227,196,0) 55%, rgba(120,92,50,0.28) 100%); }
        #s4-made .head { position: absolute; left: 110px; top: 70px; font-weight: 900; font-size: 46px; letter-spacing: 0.02em; }
        #s4-made .head i { display: block; width: 100%; height: 10px; margin-top: 6px; background: #d4401c; border-radius: 5px; font-style: normal; }
        #s4-made .card { position: absolute; top: 190px; width: 540px; height: 560px; background: #f7edd0; border: 6px solid #1d1a1c; border-radius: 24px; box-shadow: 12px 12px 0 #1d1a1c; padding: 26px 30px; }
        #s4-made .card .k { font-weight: 800; font-size: 23px; letter-spacing: 0.14em; color: #d4401c; }
        #s4-made .card .big { font-weight: 900; font-size: 118px; line-height: 132px; letter-spacing: -0.02em; margin-top: 64px; white-space: nowrap; }
        #s4-made .card .big2 { font-weight: 900; font-size: 84px; line-height: 90px; letter-spacing: -0.02em; margin-top: 34px; }
        #s4-made .card .sub { position: absolute; left: 30px; right: 30px; bottom: 26px; font-weight: 600; font-size: 27px; line-height: 1.28; }
        #s4-made .card .sub em { display: block; margin-top: 8px; font-style: italic; font-weight: 700; font-size: 22px; color: #6b3b24; }
        #s4-made .roles { position: absolute; left: 30px; right: 30px; top: 290px; display: flex; flex-direction: column; gap: 12px; }
        #s4-made .role { display: flex; align-items: center; gap: 16px; padding: 8px 18px; background: #24304f; color: #fbf1d6; border: 4px solid #1d1a1c; border-radius: 14px; font-weight: 800; font-size: 28px; letter-spacing: 0.06em; }
        #s4-made .role .ck { width: 38px; height: 38px; border-radius: 50%; background: #f1b02f; border: 4px solid #1d1a1c; display: flex; align-items: center; justify-content: center; }
        #s4-made .badge { position: absolute; right: 26px; top: 20px; width: 82px; height: 82px; border-radius: 50%; background: #2f7f86; border: 6px solid #1d1a1c; display: flex; align-items: center; justify-content: center; }
      </style>
      <div id="s4-made" data-composition-id="s4-made" data-width="1920" data-height="1080">
        <!-- PART A: art sheets become sprites (dark) -->
        <div id="s4-a" class="abs" style="width:1920px;height:1080px;">
          <img id="s4-sh-orange" class="sheet" src="assets/sheets/sheet_orange.jpg" />
          <img id="s4-sh-apple" class="sheet" src="assets/sheets/sheet_apple.jpg" style="opacity:0" />
          <img id="s4-sh-straw" class="sheet" src="assets/sheets/sheet_strawberry.jpg" style="opacity:0" />
          <img id="s4-sh-melon" class="sheet" src="assets/sheets/sheet_watermelon.jpg" style="opacity:0" />
          <img id="s4-sh-golden" class="sheet" src="assets/sheets/sheet_golden.jpg" style="opacity:0" />
          <img id="s4-sh-splash" class="sheet" src="assets/sheets/sheet_splash.jpg" style="opacity:0" />
          <svg class="abs" width="1920" height="1080" viewBox="0 0 1920 1080" style="overflow:visible">
            <rect id="s4-cr1" class="crop" pathLength="1" x="96" y="272" width="494" height="524" rx="10" />
            <rect id="s4-cr2" class="crop" pathLength="1" x="716" y="276" width="488" height="514" rx="10" />
            <rect id="s4-cr3" class="crop" pathLength="1" x="1320" y="276" width="490" height="514" rx="10" />
          </svg>
          <!-- the three sliced sprites pop out of the sheet -->
          <img id="s4-sp1" class="abs" src="assets/sprites/fruit_orange_whole.png" width="520" height="520" style="left:84px; top:276px; opacity:0" />
          <img id="s4-sp2" class="abs" src="assets/sprites/fruit_orange_half_a.png" width="520" height="520" style="left:700px; top:276px; opacity:0" />
          <img id="s4-sp3" class="abs" src="assets/sprites/fruit_orange_half_b.png" width="520" height="520" style="left:1306px; top:276px; opacity:0" />
          <!-- parade of game sprites -->
          <div id="s4-parade" class="abs" style="width:1920px;height:1080px;"></div>
          <div class="flash" id="s4-flash"></div>
          <div class="steps" id="s4-steps">
            <div class="step" id="s4-st1">Prompt</div><div class="arrow">&rarr;</div>
            <div class="step" id="s4-st2">Art sheet</div><div class="arrow">&rarr;</div>
            <div class="step" id="s4-st3">Game sprites</div>
          </div>
          <div class="tag" id="s4-tag">Art: Higgsfield GPT Image 2.5</div>
        </div>

        <!-- PART B: the numbers (paper) -->
        <div id="s4-b">
          <div class="grid"></div><div class="vig"></div>
          <div class="head" id="s4-head">How it was built<i></i></div>
          <div class="card" id="s4-card1" style="left:110px;">
            <div class="k">AUTOMATED TESTS</div>
            <div class="big" id="s4-odo" data-layout-ignore></div>
            <div class="sub">unit and end-to-end tests, all passing on the last full run</div>
          </div>
          <div class="card" id="s4-card2" style="left:690px;">
            <div class="k">A TEAM OF AI AGENTS</div>
            <div class="big2" style="font-size:66px; line-height:72px; margin-top:30px;">Built with Claude</div>
            <div class="roles">
              <div class="role" id="s4-r1"><span class="ck"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M5 12.5 L10 17.5 L19 7" fill="none" stroke="#1d1a1c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>BUILT</div>
              <div class="role" id="s4-r2"><span class="ck"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M5 12.5 L10 17.5 L19 7" fill="none" stroke="#1d1a1c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>TESTED</div>
              <div class="role" id="s4-r3"><span class="ck"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M5 12.5 L10 17.5 L19 7" fill="none" stroke="#1d1a1c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>REVIEWED</div>
            </div>
          </div>
          <div class="card" id="s4-card3" style="left:1270px;">
            <div class="k">VERIFIED ON HARDWARE</div>
            <div class="badge" id="s4-badge"><svg width="48" height="48" viewBox="0 0 24 24"><path d="M5 12.5 L10 17.5 L19 7" fill="none" stroke="#fbf1d6" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="big2" style="margin-top:96px; font-size:80px; line-height:84px;"><span style="display:block">Real</span><span style="display:block; white-space:nowrap">Joy&#8209;Con 2</span></div>
            <div class="sub">connects and streams to a Mac, about 33 samples per second<em>Controls tuned from a real recording.</em></div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          var T = 32.8;
          var K = KF.scene(T, document.getElementById("s4-made"));
          var E = KF.E;
          function hold(el, t0, keys) { return K.track(el, keys); }
          // ---- Part A (local 0 .. 3.3) ----
          // steps strip: highlights
                    function stepOn(id, tOn, tOff) {
            var el = K.$(id);
            // toggled by swapping opacity of an "on" overlay is overkill: use scale pulse + class set at setup for the final state
            K.track(el, [{ t: 0, s: 1 }, { t: tOn, s: 1, ease: E.back }, { t: tOn + 0.18, s: 1.12 }, { t: tOn + 0.45, s: 1 }]);
          }
          ["#s4-st1", "#s4-st2", "#s4-st3"].forEach(function (id, i) {
            var el = K.$(id);
            var on = [0.0, 0.5, 2.2][i];
            el.style.borderColor = "#5a5560";
            K.track(el, [{ t: 0, s: 1, css: { borderColor: "#5a5560", backgroundColor: "#1a1a22", color: "#8d8793" } }, { t: on, s: 1, ease: E.back }, { t: on + 0.15, s: 1.14, css: { borderColor: "#f1b02f", backgroundColor: "#24304f", color: "#fbf1d6" } }, { t: on + 0.45, s: 1, css: { borderColor: "#f1b02f", backgroundColor: "#24304f", color: "#fbf1d6" } }]);
          });
          K.track("#s4-tag", [{ t: 0, x: -400, o: 0 }, { t: 0.7, x: -400, o: 0, ease: E.back }, { t: 1.1, x: 0, o: 1 }, { t: 2.9, x: 0, o: 1, ease: E.in }, { t: 3.2, x: -400, o: 0 }]);
          // orange sheet: slow push, crops draw, sprites pop
          K.track("#s4-sh-orange", [{ t: 0, s: 1.0, o: 1 }, { t: 1.2, s: 1.035, o: 1, ease: E.lin }, { t: 1.3, s: 1.04, o: 0 }], { ease: E.lin });
          ["#s4-cr1", "#s4-cr2", "#s4-cr3"].forEach(function (id, i) {
            var s = 0.35 + i * 0.12;
            K.track(id, [{ t: 0, css: { strokeDashoffset: 1 }, o: 1 }, { t: s, css: { strokeDashoffset: 1 }, ease: E.out }, { t: s + 0.4, css: { strokeDashoffset: 0 } }, { t: 1.0, o: 1, ease: E.lin }, { t: 1.12, o: 0 }], { ease: E.out });
          });
          ["#s4-sp1", "#s4-sp2", "#s4-sp3"].forEach(function (id, i) {
            var s = 0.8 + i * 0.07;
            K.track(id, [{ t: 0, s: 1.0, y: 0, o: 0 }, { t: s, s: 1.0, y: 0, o: 0, ease: E.out }, { t: s + 0.05, s: 1.0, y: 0, o: 1, ease: E.out }, { t: s + 0.2, s: 1.08, y: -14, o: 1, ease: E.lin }, { t: 1.17, s: 1.08, y: -14, o: 1, ease: E.in }, { t: 1.29, s: 0.4, y: 40, o: 0 }]);
          });
          // rapid art-sheet montage 1.2 .. 2.2
          var mont = ["#s4-sh-apple", "#s4-sh-straw", "#s4-sh-melon", "#s4-sh-golden", "#s4-sh-splash"];
          mont.forEach(function (id, i) {
            var s = 1.3 + i * 0.19;
            K.track(id, [{ t: 0, o: 0, s: 1.04 }, { t: s - 0.001, o: 0, s: 1.04, ease: E.lin }, { t: s, o: 1, s: 1.04, ease: E.lin }, { t: s + 0.2, o: 1, s: 1.0, ease: E.lin }, { t: s + 0.2001, o: 0, s: 1.0 }]);
          });
          K.track("#s4-flash", [{ t: 0, o: 0 }, { t: 1.2, o: 0, ease: E.lin }, { t: 1.26, o: 0.6, ease: E.out }, { t: 1.5, o: 0 }, { t: 2.2, o: 0, ease: E.lin }, { t: 2.24, o: 0.7, ease: E.out }, { t: 2.6, o: 0 }]);

          // parade (2.2 .. 3.3): 16 game sprites
          var names = ["fruit_apple_whole", "fruit_orange_whole", "fruit_strawberry_whole", "fruit_watermelon_whole", "fruit_pineapple_whole", "fruit_cherry_whole", "fruit_golden_whole", "bomb_whole",
                       "fruit_kiwi_whole", "fruit_lemon_whole", "fruit_peach_whole", "fruit_pear_whole", "medallion_freeze", "medallion_frenzy", "medallion_double", "medallion_clock"];
          var par = K.$("#s4-parade");
          names.forEach(function (n, i) {
            var im = document.createElement("img");
            im.className = "par";
            im.src = "assets/sprites/" + n + ".png";
            im.style.left = (96 + (i % 8) * 214) + "px";
            im.style.top = (i < 8 ? 236 : 500) + "px";
            im.style.width = "190px"; im.style.height = "190px";
            im.style.opacity = "0";
            par.appendChild(im);
            var s = 2.15 + i * 0.04;
            K.track(im, [{ t: 0, y: 140, s: 0.2, r: -40, o: 0 }, { t: s, y: 140, s: 0.2, r: -40, o: 0, ease: E.back }, { t: s + 0.4, y: 0, s: 1, r: (i % 2 ? 6 : -6), o: 1, ease: E.lin }, { t: 3.2, y: 0, s: 1, r: (i % 2 ? 6 : -6), o: 1, ease: E.lin }, { t: 3.29, y: 0, s: 1, r: (i % 2 ? 6 : -6), o: 0 }]);
          });
          // the dark scene ends at 3.3: hide part A, part B appears under the quick ink swipe at 36.1
          K.track("#s4-a", [{ t: 0, o: 1 }, { t: 3.29, o: 1, ease: E.lin }, { t: 3.3, o: 0 }], { ease: E.lin });
          K.track("#s4-b", [{ t: 0, o: 0 }, { t: 3.29, o: 0, ease: E.lin }, { t: 3.3, o: 1 }], { ease: E.lin });

          // ---- Part B (local 3.3 ..) ----
          K.track("#s4-head", [{ t: 0, x: -50, o: 0 }, { t: 3.4, x: -50, o: 0, ease: E.out }, { t: 3.85, x: 0, o: 1 }]);
          var cards = [["#s4-card1", 3.7, -3], ["#s4-card2", 5.5, 2.5], ["#s4-card3", 6.8, -2]];
          cards.forEach(function (c) {
            K.track(c[0], [{ t: 0, s: 1.35, r: c[2] * 2, o: 0, y: -40 }, { t: c[1] - 0.001, s: 1.35, r: c[2] * 2, o: 0, y: -40, ease: E.out }, { t: c[1] + 0.02, s: 1.35, r: c[2] * 2, o: 1, y: -40, ease: E.back }, { t: c[1] + 0.32, s: 1, r: c[2] * 0.35, o: 1, y: 0 }]);
          });
          // odometer 2,033 (docs/FINAL-STATUS.md: npm test, 2033 tests, 0 failed)
          var odo = KF.odometer(K.$("#s4-odo"), "2,033", 132);
          var dig = [2, 0, 3, 3];
          odo.forEach(function (d, i) {
                        var t0 = 3.9 + i * 0.12, t1 = 5.2 + i * 0.12;
            K.track(d.reel, [{ t: 0, y: 0 }, { t: t0, y: 0, ease: "cubic-bezier(0.2,0.7,0.2,1)" }, { t: t1, y: -(dig[i] + 10 * (i === 0 ? 1 : 2)) * 132 }], { ease: "cubic-bezier(0.2,0.7,0.2,1)" });
          });
          // roles tick in
          [["#s4-r1", 5.9], ["#s4-r2", 6.25], ["#s4-r3", 6.6]].forEach(function (r) {
            K.track(r[0], [{ t: 0, x: -60, o: 0 }, { t: r[1], x: -60, o: 0, ease: E.out }, { t: r[1] + 0.35, x: 0, o: 1 }]);
          });
          K.track("#s4-badge", [{ t: 0, s: 0, r: -40, o: 0 }, { t: 7.25, s: 0, r: -40, o: 0, ease: E.back }, { t: 7.7, s: 1, r: 0, o: 1 }]);
        })();
      </script>
    </template>
  </body>
</html>
